[project]
name = "bolos-business-agent"
version = "0.2.0"
description = "Bolos Negocios — agente de WhatsApp para pequeños negocios"
requires-python = ">=3.13,<3.14"
dependencies = [
    "fastapi==0.141.1",
    "uvicorn[standard]>=0.35",
    "pydantic>=2.11",
    "pydantic-settings==2.15.0",
    "sqlalchemy[asyncio]==2.0.53",
    "asyncpg==0.31.0",
    "alembic==1.20.0",
    "redis>=5.2,<6",
    "arq==0.28.0",
    "structlog==26.1.0",
    "httpx==0.28.1",
    "pydantic-ai-slim[google,openai]==2.53.0",  # openai: su cliente lo usan los proveedores compatibles (DeepSeek)
    "itsdangerous>=2.2",
    "boto3>=1.40,<2",
    "pillow>=13,<14",
    "python-multipart>=0.0.20,<1",
    "xlsxwriter==3.2.9",
    "sentry-sdk>=2.55,<3",
]

[dependency-groups]
dev = [
    "pytest==9.1.1",
    "pytest-asyncio==1.4.0",
    "import-linter==2.15",
    "ruff>=0.13",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
testpaths = ["tests"]
addopts = "-q -p no:cacheprovider"

[tool.ruff]
line-length = 110
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "ASYNC"]
ignore = ["E501", "B008"]

[tool.importlinter]
root_package = "app"
include_external_packages = true

[[tool.importlinter.contracts]]
name = "domain es puro: no depende de nada del proyecto ni de frameworks"
type = "forbidden"
source_modules = ["app.domain"]
forbidden_modules = ["app.application", "app.db", "app.infra", "app.agent", "app.api", "app.channels", "app.llm", "app.container",
                     "sqlalchemy", "fastapi", "pydantic_ai", "redis"]

[[tool.importlinter.contracts]]
name = "application no conoce agente, api, canales, infra concreta ni el framework de LLM"
type = "forbidden"
source_modules = ["app.application"]
forbidden_modules = ["app.infra", "app.agent", "app.api", "app.channels", "app.llm", "app.container", "pydantic_ai", "fastapi"]
allow_indirect_imports = true

[[tool.importlinter.contracts]]
name = "agent nunca toca la base directamente (solo vía application)"
type = "forbidden"
source_modules = ["app.agent"]
forbidden_modules = ["app.db", "app.infra", "sqlalchemy", "app.api"]
allow_indirect_imports = true

[[tool.importlinter.contracts]]
name = "pydantic_ai confinado a agent y llm (el resto importa solo vía container)"
type = "forbidden"
source_modules = ["app.domain", "app.application", "app.db", "app.infra", "app.api", "app.channels"]
forbidden_modules = ["pydantic_ai"]
allow_indirect_imports = true
